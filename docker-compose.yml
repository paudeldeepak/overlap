# to start:  docker compose up -d
services:
  overlap:
    build: https://github.com/paudeldeepak/overlap.git#main
    image: overlap
    container_name: overlap
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /data/overlap.db
      TRUST_PROXY: 1
    ports:
      - "3417:8080"
    volumes:
      - overlap-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  overlap-data:
